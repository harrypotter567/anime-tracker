<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Tracker · personal shelf</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: #f7f3f0;
            background-image: radial-gradient(circle at 10% 20%, #ffe6d5 0%, #f7f3f0 70%);
            min-height: 100vh;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container {
            max-width: 1300px;
            width: 100%;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 3rem;
            padding: 2rem 2rem 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 6px 12px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 240, 230, 0.7);
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: #2e241f;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 0.25rem;
        }

        h1 span {
            background: #e9d6c9;
            font-size: 1.8rem;
            padding: 0 10px;
            border-radius: 40px;
            line-height: 1.4;
        }

        .subhead {
            color: #735f54;
            margin-bottom: 2rem;
            font-size: 1.05rem;
            font-weight: 400;
            border-left: 4px solid #d9b8a4;
            padding-left: 1rem;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.8rem;
        }

        @media (max-width: 750px) {
            .grid-layout {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
            .app-container {
                padding: 1.8rem 1.2rem;
            }
            h1 {
                font-size: 1.9rem;
            }
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .card {
            background: #ffffffdb;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 2rem;
            padding: 1.5rem 1.5rem 1.8rem;
            box-shadow: 0 12px 24px -8px rgba(80, 60, 50, 0.12);
            border: 1px solid #fff4ec;
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-3px);
        }

        .card h2 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #3a2c24;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.2px;
        }

        .card h2 i {
            font-style: normal;
            font-size: 1.5rem;
        }

        .add-form {
            display: flex;
            gap: 8px;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .add-form input {
            flex: 1;
            padding: 0.8rem 1rem;
            border-radius: 50px;
            border: 1px solid #e3d9d1;
            background: #fefcfb;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
            min-width: 140px;
            color: #2e241f;
        }

        .add-form input:focus {
            border-color: #c6a38b;
            box-shadow: 0 0 0 4px rgba(198, 163, 139, 0.2);
            background: white;
        }

        .add-form button {
            background: #2e241f;
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.05);
            white-space: nowrap;
        }

        .add-form button:hover {
            background: #4a382f;
            transform: scale(1.02);
        }

        .add-form button:active {
            transform: scale(0.98);
        }

        .anime-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 6px;
            scrollbar-width: thin;
            scrollbar-color: #d9c6b8 #f3ede8;
        }

        .anime-list::-webkit-scrollbar {
            width: 6px;
        }

        .anime-list::-webkit-scrollbar-track {
            background: #f3ede8;
            border-radius: 12px;
        }

        .anime-list::-webkit-scrollbar-thumb {
            background: #d9c6b8;
            border-radius: 12px;
        }

        .anime-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.85rem 1.2rem;
            background: #fcf8f5;
            border-radius: 60px;
            border: 1px solid #f0e4dc;
            transition: all 0.15s;
            font-size: 0.98rem;
            color: #2b221e;
            font-weight: 500;
        }

        .anime-item:hover {
            background: #ffffff;
            border-color: #d9c2b2;
            box-shadow: 0 4px 10px rgba(160, 120, 100, 0.08);
        }

        .item-title {
            word-break: break-word;
            padding-right: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .item-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .icon-btn {
            background: transparent;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.15s;
            color: #5f4d42;
            background: #f1e7e0;
            line-height: 1;
        }

        .icon-btn:hover {
            background: #e0cfc2;
            color: #2e241f;
            transform: scale(1.08);
        }

        .icon-btn.watched-btn {
            background: #d9e6d4;
            color: #32643b;
        }

        .icon-btn.watched-btn:hover {
            background: #bdd6b4;
        }

        .icon-btn.delete-btn {
            background: #f3dedb;
            color: #a1453c;
        }

        .icon-btn.delete-btn:hover {
            background: #e9c9c4;
        }

        .empty-message {
            color: #a28d80;
            font-style: italic;
            padding: 0.8rem 0.5rem;
            text-align: center;
            background: #faf6f2;
            border-radius: 40px;
            font-size: 0.95rem;
            border: 1px dashed #ddd0c6;
        }

        .suggestions-section {
            background: #f4ede8;
            border-radius: 1.8rem;
            padding: 1.4rem 1.5rem 1.7rem;
            border: 1px solid #e6d7cd;
            box-shadow: inset 0 1px 4px rgba(255, 255, 255, 0.8);
            margin-top: 0.4rem;
        }

        .suggestions-section h3 {
            font-size: 1.15rem;
            font-weight: 600;
            color: #4a3b32;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .suggestion-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .suggestion-chip {
            background: white;
            border: 1px solid #e7d9d0;
            border-radius: 60px;
            padding: 0.6rem 1.2rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: #3d2e27;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.15s;
            cursor: default;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.02);
        }

        .suggestion-chip .add-suggestion-btn {
            background: #e9dad0;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-size: 1rem;
            font-weight: 600;
            color: #4f3e35;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s;
            line-height: 1;
            margin-left: 4px;
        }

        .suggestion-chip .add-suggestion-btn:hover {
            background: #cbb6a8;
            color: #1f1612;
            transform: scale(1.1);
        }

        .footer-note {
            margin-top: 2rem;
            text-align: center;
            color: #9f8b7e;
            font-size: 0.85rem;
            letter-spacing: 0.2px;
        }

        .divider {
            height: 2px;
            background: linear-gradient(to right, transparent, #e0d2c8, transparent);
            margin: 0.5rem 0 1rem;
        }

        .badge {
            background: #e9d6c9;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.2rem 0.7rem;
            color: #4e3d33;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .flex-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <h1>
            📺 anime shelf
            <span>✧</span>
        </h1>
        <div class="subhead">keep track · what you've watched · what to watch next</div>

        <div class="grid-layout">
            <!-- LEFT COLUMN: WATCHED LIST -->
            <div class="column">
                <div class="card">
                    <h2>
                        <i>✅</i> Already watched
                        <span class="badge" id="watchedCount">0</span>
                    </h2>
                    <div class="add-form">
                        <input type="text" id="watchedInput" placeholder="e.g. Frieren, Jujutsu Kaisen..." autocomplete="off">
                        <button id="addWatchedBtn">+ Add</button>
                    </div>
                    <ul class="anime-list" id="watchedList">
                        <!-- Watched items will be injected here -->
                    </ul>
                </div>
            </div>

            <!-- RIGHT COLUMN: PLAN TO WATCH + SUGGESTIONS -->
            <div class="column">
                <div class="card">
                    <h2>
                        <i>📌</i> Plan to watch
                        <span class="badge" id="planCount">0</span>
                    </h2>
                    <div class="add-form">
                        <input type="text" id="planInput" placeholder="e.g. Chainsaw Man, Blue Lock..." autocomplete="off">
                        <button id="addPlanBtn">+ Add</button>
                    </div>
                    <ul class="anime-list" id="planList">
                        <!-- Plan items will be injected here -->
                    </ul>
                </div>

                <!-- SUGGESTIONS SECTION -->
                <div class="suggestions-section">
                    <h3>
                        <span>✨</span> Suggestions for you
                        <span style="font-size: 0.8rem; font-weight: 400; color: #8b776b; margin-left: auto;">click + to add</span>
                    </h3>
                    <div class="suggestion-chips" id="suggestionsContainer">
                        <!-- Suggestion chips will be injected -->
                    </div>
                </div>
            </div>
        </div>
        <div class="footer-note">
            ⏤ your personal anime tracker ⏤
        </div>
    </div>

    <script>
        (function() {
            // ---------- STORAGE KEYS ----------
            const WATCHED_KEY = 'anime_tracker_watched';
            const PLAN_KEY = 'anime_tracker_plan';

            // ---------- DEFAULT DATA (if nothing stored) ----------
            const defaultWatched = [
                { id: 'w1', title: 'Fullmetal Alchemist: Brotherhood' },
                { id: 'w2', title: 'Steins;Gate' },
                { id: 'w3', title: 'Demon Slayer' },
                { id: 'w4', title: 'Spy x Family' }
            ];

            const defaultPlan = [
                { id: 'p1', title: 'Frieren: Beyond Journey\'s End' },
                { id: 'p2', title: 'Chainsaw Man' },
                { id: 'p3', title: 'Jujutsu Kaisen Season 2' },
                { id: 'p4', title: 'Vinland Saga Season 2' }
            ];

            // ---------- SUGGESTION POOL (static curated) ----------
            const SUGGESTION_POOL = [
                { title: 'Mob Psycho 100', genre: 'action/comedy' },
                { title: 'Odd Taxi', genre: 'mystery/drama' },
                { title: 'Cyberpunk: Edgerunners', genre: 'sci-fi/action' },
                { title: 'Bocchi the Rock!', genre: 'comedy/music' },
                { title: 'Apothecary Diaries', genre: 'historical/mystery' },
                { title: 'Dungeon Meshi', genre: 'fantasy/adventure' },
                { title: 'Blue Eye Samurai', genre: 'action/drama' },
                { title: 'Pluto', genre: 'sci-fi/thriller' },
                { title: 'Link Click', genre: 'mystery/supernatural' },
                { title: 'Heavenly Delusion', genre: 'sci-fi/mystery' }
            ];

            // ---------- DATA LAYER ----------
            let watched = [];
            let plan = [];

            // Load from localStorage or set defaults
            function loadData() {
                const storedWatched = localStorage.getItem(WATCHED_KEY);
                const storedPlan = localStorage.getItem(PLAN_KEY);

                if (storedWatched) {
                    try {
                        watched = JSON.parse(storedWatched);
                    } catch (e) {
                        watched = [...defaultWatched];
                    }
                } else {
                    watched = [...defaultWatched];
                }

                if (storedPlan) {
                    try {
                        plan = JSON.parse(storedPlan);
                    } catch (e) {
                        plan = [...defaultPlan];
                    }
                } else {
                    plan = [...defaultPlan];
                }

                // ensure each has an id (for legacy)
                watched = watched.map((item, idx) => ({
                    id: item.id || `w_${Date.now()}_${idx}`,
                    title: item.title
                }));
                plan = plan.map((item, idx) => ({
                    id: item.id || `p_${Date.now()}_${idx}`,
                    title: item.title
                }));
            }

            // Save to localStorage
            function saveData() {
                localStorage.setItem(WATCHED_KEY, JSON.stringify(watched));
                localStorage.setItem(PLAN_KEY, JSON.stringify(plan));
            }

            // ---------- RENDER FUNCTIONS ----------
            const watchedListEl = document.getElementById('watchedList');
            const planListEl = document.getElementById('planList');
            const watchedCountEl = document.getElementById('watchedCount');
            const planCountEl = document.getElementById('planCount');
            const suggestionsContainer = document.getElementById('suggestionsContainer');

            // Update counts
            function updateCounts() {
                watchedCountEl.textContent = watched.length;
                planCountEl.textContent = plan.length;
            }

            // Render watched list
            function renderWatched() {
                if (!watchedListEl) return;
                if (watched.length === 0) {
                    watchedListEl.innerHTML = `<div class="empty-message">✨ no anime watched yet — add some!</div>`;
                    return;
                }
                let html = '';
                watched.forEach(item => {
                    html += `
                        <li class="anime-item" data-id="${item.id}">
                            <span class="item-title">📖 ${escapeHtml(item.title)}</span>
                            <div class="item-actions">
                                <button class="icon-btn delete-btn" data-action="delete-watched" data-id="${item.id}" title="Remove">🗑️</button>
                            </div>
                        </li>
                    `;
                });
                watchedListEl.innerHTML = html;
            }

            // Render plan list
            function renderPlan() {
                if (!planListEl) return;
                if (plan.length === 0) {
                    planListEl.innerHTML = `<div class="empty-message">📭 nothing planned — add what you want to watch</div>`;
                    return;
                }
                let html = '';
                plan.forEach(item => {
                    html += `
                        <li class="anime-item" data-id="${item.id}">
                            <span class="item-title">⏳ ${escapeHtml(item.title)}</span>
                            <div class="item-actions">
                                <button class="icon-btn watched-btn" data-action="move-to-watched" data-id="${item.id}" title="Mark as watched">✅</button>
                                <button class="icon-btn delete-btn" data-action="delete-plan" data-id="${item.id}" title="Remove">🗑️</button>
                            </div>
                        </li>
                    `;
                });
                planListEl.innerHTML = html;
            }

            // Simple escape
            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // Render suggestions — exclude titles already in watched or plan
            function renderSuggestions() {
                if (!suggestionsContainer) return;

                const existingTitles = new Set([
                    ...watched.map(w => w.title.toLowerCase().trim()),
                    ...plan.map(p => p.title.toLowerCase().trim())
                ]);

                const availableSuggestions = SUGGESTION_POOL.filter(
                    sug => !existingTitles.has(sug.title.toLowerCase().trim())
                );

                if (availableSuggestions.length === 0) {
                    suggestionsContainer.innerHTML = `<div class="empty-message" style="width:100%;">🎉 you've added all suggestions!</div>`;
                    return;
                }

                let html = '';
                availableSuggestions.forEach(sug => {
                    html += `
                        <div class="suggestion-chip" data-suggestion-title="${escapeHtml(sug.title)}">
                            <span>${escapeHtml(sug.title)}</span>
                            <span style="font-size:0.75rem; color:#9a8476; margin-left:4px;">${sug.genre || ''}</span>
                            <button class="add-suggestion-btn" data-action="add-suggestion" data-title="${escapeHtml(sug.title)}" title="Add to plan">+</button>
                        </div>
                    `;
                });
                suggestionsContainer.innerHTML = html;
            }

            // Full render + save
            function refreshUI() {
                renderWatched();
                renderPlan();
                renderSuggestions();
                updateCounts();
                saveData();
            }

            // ---------- ACTION HANDLERS ----------
            function addWatched(title) {
                const trimmed = title.trim();
                if (!trimmed) return false;

                // avoid exact duplicates in watched
                const exists = watched.some(item => item.title.toLowerCase() === trimmed.toLowerCase());
                if (exists) {
                    alert(`"${trimmed}" is already in your watched list.`);
                    return false;
                }

                const newItem = {
                    id: 'w_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
                    title: trimmed
                };
                watched.push(newItem);
                refreshUI();
                return true;
            }

            function addPlan(title) {
                const trimmed = title.trim();
                if (!trimmed) return false;

                // avoid exact duplicates in plan
                const existsInPlan = plan.some(item => item.title.toLowerCase() === trimmed.toLowerCase());
                if (existsInPlan) {
                    alert(`"${trimmed}" is already in your plan list.`);
                    return false;
                }
                // also check watched? (optional, but better to prevent duplication across lists)
                const existsInWatched = watched.some(item => item.title.toLowerCase() === trimmed.toLowerCase());
                if (existsInWatched) {
                    alert(`"${trimmed}" is already marked as watched. Remove it from watched first, or add a different title.`);
                    return false;
                }

                const newItem = {
                    id: 'p_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
                    title: trimmed
                };
                plan.push(newItem);
                refreshUI();
                return true;
            }

            function deleteWatched(id) {
                watched = watched.filter(item => item.id !== id);
                refreshUI();
            }

            function deletePlan(id) {
                plan = plan.filter(item => item.id !== id);
                refreshUI();
            }

            function movePlanToWatched(id) {
                const planItem = plan.find(item => item.id === id);
                if (!planItem) return;

                // prevent duplicate in watched
                const alreadyWatched = watched.some(w => w.title.toLowerCase() === planItem.title.toLowerCase());
                if (alreadyWatched) {
                    if (confirm(`"${planItem.title}" is already in watched. Remove from plan?`)) {
                        plan = plan.filter(item => item.id !== id);
                        refreshUI();
                    }
                    return;
                }

                // add to watched
                const newWatched = {
                    id: 'w_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
                    title: planItem.title
                };
                watched.push(newWatched);
                // remove from plan
                plan = plan.filter(item => item.id !== id);
                refreshUI();
            }

            // suggestion add -> add to plan (if not already there or in watched)
            function addSuggestionToPlan(title) {
                const trimmed = title.trim();
                if (!trimmed) return;

                const inWatched = watched.some(w => w.title.toLowerCase() === trimmed.toLowerCase());
                if (inWatched) {
                    alert(`"${trimmed}" is already in your watched list.`);
                    return;
                }
                const inPlan = plan.some(p => p.title.toLowerCase() === trimmed.toLowerCase());
                if (inPlan) {
                    alert(`"${trimmed}" is already in your plan list.`);
                    return;
                }

                const newItem = {
                    id: 'p_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
                    title: trimmed
                };
                plan.push(newItem);
                refreshUI();
            }

            // ---------- EVENT DELEGATION ----------
            function setupEventListeners() {
                // watched list delete
                watchedListEl.addEventListener('click', (e) => {
                    const deleteBtn = e.target.closest('[data-action="delete-watched"]');
                    if (deleteBtn) {
                        const id = deleteBtn.getAttribute('data-id');
                        if (id) deleteWatched(id);
                    }
                });

                // plan list actions
                planListEl.addEventListener('click', (e) => {
                    const moveBtn = e.target.closest('[data-action="move-to-watched"]');
                    if (moveBtn) {
                        const id = moveBtn.getAttribute('data-id');
                        if (id) movePlanToWatched(id);
                        return;
                    }

                    const deleteBtn = e.target.closest('[data-action="delete-plan"]');
                    if (deleteBtn) {
                        const id = deleteBtn.getAttribute('data-id');
                        if (id) deletePlan(id);
                    }
                });

                // suggestions container click (add to plan)
                suggestionsContainer.addEventListener('click', (e) => {
                    const addBtn = e.target.closest('[data-action="add-suggestion"]');
                    if (addBtn) {
                        const title = addBtn.getAttribute('data-title');
                        if (title) addSuggestionToPlan(title);
                    }
                });

                // Add watched button + enter key
                const watchedInput = document.getElementById('watchedInput');
                const addWatchedBtn = document.getElementById('addWatchedBtn');
                addWatchedBtn.addEventListener('click', () => {
                    if (addWatched(watchedInput.value)) {
                        watchedInput.value = '';
                        watchedInput.focus();
                    }
                });
                watchedInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        if (addWatched(watchedInput.value)) {
                            watchedInput.value = '';
                            watchedInput.focus();
                        }
                    }
                });

                // Add plan button + enter key
                const planInput = document.getElementById('planInput');
                const addPlanBtn = document.getElementById('addPlanBtn');
                addPlanBtn.addEventListener('click', () => {
                    if (addPlan(planInput.value)) {
                        planInput.value = '';
                        planInput.focus();
                    }
                });
                planInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        if (addPlan(planInput.value)) {
                            planInput.value = '';
                            planInput.focus();
                        }
                    }
                });
            }

            // ---------- INITIALIZATION ----------
            function init() {
                loadData();
                // Ensure default suggestions are visible even if stored data missing some
                // (but suggestions are auto-filtered)
                renderWatched();
                renderPlan();
                renderSuggestions();
                updateCounts();
                setupEventListeners();
                // make sure any lingering storage is consistent
                saveData();
            }

            // start the app
            init();
        })();
    </script>
</body>
</html>
